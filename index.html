<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3E9D9">
<meta name="description" content="Дълбок Прочит — превръща книга в компресирана версия: карта на идеите, концепциите в дълбочина, критика на аргументацията и концентрат за 20 минути.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F3E9D9'/%3E%3Cpath d='M6 7h8a3 3 0 013 3v16a3 3 0 00-3-2.5H6z' fill='none' stroke='%238A2F3E' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M26 7h-8a3 3 0 00-3 3v16a3 3 0 013-2.5h8z' fill='none' stroke='%238A2F3E' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Дълбок Прочит</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,500;0,600;0,700;1,500&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3E9D9; --raised:#FCF7EC; --sunk:#EADDC7;
  --ink:#2A201B; --ink2:#6B594B; --ink3:#93816F;
  --rule:#DCC9AC; --wine:#8A2F3E; --saffron:#C98A21; --pine:#3F5A4C;
  --shadow:0 1px 0 rgba(42,32,27,.06), 0 8px 24px -18px rgba(42,32,27,.5);
  --fs:16px;
  --top: calc(env(safe-area-inset-top, 0px) + 66px);
  --bot: calc(env(safe-area-inset-bottom, 0px) + 64px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  font-family:'Literata',Georgia,serif;color:var(--ink);font-size:var(--fs);
  line-height:1.62;-webkit-font-smoothing:antialiased;
  padding-top:var(--top);padding-bottom:var(--bot);min-height:100vh;
}
button{font-family:inherit;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.disp{font-family:'Vollkorn',Georgia,serif}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* заглавна лента — марката е централна, без бутони, за да не се крие под чуждо меню */
.head{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(243,233,217,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top, 0px) + 11px) 16px 9px;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.brand{font-family:'Vollkorn',Georgia,serif;font-size:19px;font-weight:600;
  line-height:1.05;letter-spacing:-.005em;white-space:nowrap}
.brand i{font-style:italic;color:var(--wine)}
.hsub{font-family:'Vollkorn',Georgia,serif;font-size:15.5px;font-weight:600;
  color:var(--wine);max-width:92vw;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub:empty{display:none}

/* голямата марка на началния екран */
.lock{text-align:center;padding:14px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.lock .w{font-family:'Vollkorn',Georgia,serif;font-weight:600;
  font-size:clamp(40px,13vw,76px);line-height:.98;letter-spacing:-.025em;display:block}
.lock .w i{font-style:italic;color:var(--wine);display:block}
.lock .r{width:54px;height:2px;background:var(--saffron);margin:16px auto 14px;border-radius:2px}
.lock .t{font-family:'Vollkorn',serif;font-style:italic;font-size:19px;color:var(--ink2)}

/* долна лента — всички менюта са тук, в обсега на палеца */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--raised);
  border-top:1px solid var(--rule);display:flex;
  padding:8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);gap:6px}
.nav button{flex:1;border:none;background:none;border-radius:6px;padding:8px 3px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink2)}
.nav button svg{opacity:.9}
.nav button:active{background:var(--sunk)}
.nav button.on{color:var(--wine)}
.nav button.on svg{opacity:1}
.nav button[disabled]{opacity:.3}

.wrap{max-width:820px;margin:0 auto;padding:22px 16px 40px}
h1.big{font-family:'Vollkorn',serif;font-weight:600;font-size:clamp(30px,7vw,46px);
  line-height:1.06;margin:0 0 14px;letter-spacing:-.015em}
h1.big i{font-style:italic;color:var(--wine)}
h2.sec{font-family:'Vollkorn',serif;font-size:24px;font-weight:600;margin:0 0 4px;line-height:1.2}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
p.lead{color:var(--ink2);margin:0 0 22px;font-size:16.5px;max-width:52ch}
.muted{color:var(--ink2)}
.stat{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
  color:var(--ink3);text-transform:uppercase}

.btn{border:1px solid var(--rule);background:var(--raised);border-radius:3px;
  padding:11px 16px;font-size:15px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;min-height:46px}
.btn:active{background:#fff}
.btn.pri{background:var(--wine);color:#FCF7EC;border-color:var(--wine)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:130px}

.card{background:var(--raised);border:1px solid var(--rule);border-radius:3px;
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.wine{border-left:4px solid var(--wine)}
.card.saf{border-left:4px solid var(--saffron)}
.drop{border:1.5px dashed var(--rule);background:var(--raised);border-radius:3px;
  padding:26px 18px;text-align:center}
.drop h3{font-family:'Vollkorn',serif;font-size:20px;margin:0 0 6px;font-weight:600}
.drop p{color:var(--ink2);font-size:14px;margin:0 0 16px}

label.f{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:18px 0 7px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--rule);background:var(--raised);
  border-radius:3px;padding:12px;min-height:48px}
textarea.f{min-height:110px;resize:vertical;font-size:15px}
.hint{font-size:13.5px;color:var(--ink2);margin:7px 0 0}

.pill{border:1px solid var(--rule);background:var(--raised);border-radius:99px;
  padding:8px 14px;font-size:13.5px;color:var(--ink2);min-height:40px}
.pill.on{background:var(--wine);color:#FCF7EC;border-color:var(--wine)}

.list{display:grid;gap:10px}
.bookrow{display:flex;align-items:stretch;gap:0;background:var(--raised);
  border:1px solid var(--rule);border-left:5px solid var(--wine);border-radius:3px;
  box-shadow:var(--shadow);overflow:hidden}
.bookrow.part{border-left-color:var(--saffron)}
.bookrow .main{flex:1;text-align:left;border:none;background:none;padding:14px 14px 12px}
.bookrow h4{font-family:'Vollkorn',serif;font-size:17px;margin:0 0 3px;font-weight:600;line-height:1.25}
.bookrow .aut{color:var(--ink2);font-size:13px;margin:0 0 9px}
.bookrow .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);
  display:flex;gap:10px;flex-wrap:wrap}
.bookrow .del{border:none;border-left:1px solid var(--rule);background:none;
  color:var(--ink3);padding:0 15px;font-size:12px}
.bookrow .del.armed{background:var(--wine);color:#FCF7EC;font-family:'JetBrains Mono',monospace;font-size:10px}

.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.bar span{display:block;height:100%;background:var(--wine);transition:width .4s ease}
.log{border:1px solid var(--rule);background:var(--raised);border-radius:3px;
  max-height:280px;overflow:auto;margin:18px 0}
.log div{padding:9px 13px;border-bottom:1px solid var(--sunk);font-size:13.5px;display:flex;gap:9px}
.log div:last-child{border-bottom:none}
.log .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);padding-top:3px;min-width:22px}
.log .now{background:#fff;color:var(--wine)}
.log .warn{color:var(--saffron)}
.log .fail{color:var(--wine)}
.err{border:1px solid var(--wine);background:#fff;border-left:4px solid var(--wine);
  padding:14px;border-radius:3px;font-size:14.5px;margin-bottom:16px}

table.plan{width:100%;border-collapse:collapse;font-size:14px}
table.plan td{padding:8px 0;border-bottom:1px solid var(--sunk);vertical-align:top}
table.plan td:first-child{color:var(--ink2);width:44%}
table.plan tr:last-child td{border-bottom:none}
.big-num{font-family:'Vollkorn',serif;font-size:30px;font-weight:600;line-height:1}

/* четене */
.toc{background:var(--raised);border:1px solid var(--rule);border-radius:3px;
  padding:8px;margin-bottom:16px}
.toc button{display:block;width:100%;text-align:left;border:none;background:none;
  padding:9px 10px;font-size:14px;color:var(--ink2);border-radius:3px;line-height:1.35}
.toc button:active{background:var(--sunk)}
.toc .g{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink);font-weight:700;
  padding:16px 10px 7px;margin-top:4px;border-bottom:1px solid var(--rule)}
.toc .g:first-child{margin-top:0;padding-top:8px}
.art{background:var(--raised);border:1px solid var(--rule);border-radius:3px;
  padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--top) + 10px)}
.art.read{border-left:3px solid var(--pine)}
.ah{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--sunk)}
.ah .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--wine);padding-top:6px}
.ah h2{font-family:'Vollkorn',serif;font-size:21px;font-weight:600;margin:0;line-height:1.22;flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tool{border:1px solid var(--rule);background:var(--raised);border-radius:99px;
  padding:7px 14px 7px 11px;font-size:13px;color:var(--ink2);min-height:40px;
  display:inline-flex;align-items:center;gap:7px}
.tool svg{width:18px;height:18px;flex-shrink:0}
.btn svg{width:19px;height:19px}
.bookrow .del svg{width:17px;height:17px}
.tool.on{background:var(--wine);color:#FCF7EC;border-color:var(--wine)}
.tool.ok{background:var(--pine);color:#FCF7EC;border-color:var(--pine)}
.tool.saf{background:var(--saffron);color:#2A201B;border-color:var(--saffron)}
h3.mdh{font-family:'Vollkorn',serif;font-size:17px;margin:22px 0 7px;color:var(--wine);font-weight:600}
h4.mdh{font-family:'Vollkorn',serif;font-size:15.5px;margin:18px 0 6px;font-weight:600}
/* Двустранното подравняване на тесен екран прави реки от бели дупки —
   българският почти не се сричкопренася в браузър, затова дясната
   страна остава свободна, а думите запазват нормалните си разстояния. */
.art p, .qbody p, .art li, .qbody li{text-align:left;overflow-wrap:break-word;word-break:normal}
.art p{margin:0 0 12px}
.art ul,.art ol{margin:0 0 13px;padding-left:20px}
.art li{margin-bottom:5px}
.art blockquote{margin:13px 0;padding:2px 0 2px 14px;border-left:3px solid var(--saffron);
  color:var(--ink2);font-style:italic}
.art hr{border:none;height:1px;background:var(--rule);margin:18px 0}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--sunk);
  padding:1px 5px;border-radius:2px}
.notes{margin-top:14px;padding-top:13px;border-top:1px dashed var(--rule)}
.note{background:#FFFDF7;border:1px solid var(--rule);border-left:3px solid var(--saffron);
  border-radius:3px;padding:11px 12px;margin-bottom:9px;font-size:14.5px;position:relative}
.note .q{color:var(--ink2);font-style:italic;font-size:13.5px;margin-bottom:6px;
  padding-left:9px;border-left:2px solid var(--sunk)}
.note .ts{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);margin-top:7px}
.note .x{position:absolute;top:6px;right:8px;border:none;background:none;color:var(--ink3);
  padding:6px 8px;font-size:15px}
.turn{background:var(--raised);border:1px solid var(--rule);border-radius:3px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.turn.open{border-left:4px solid var(--wine)}
.qhead{display:flex;width:100%;text-align:left;border:none;background:none;
  padding:13px 12px;gap:10px;align-items:flex-start}
.qhead .qn{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink3);padding-top:3px}
.qhead .qt{flex:1;font-size:15px;line-height:1.4}
.turn.open .qhead .qt{font-weight:600}
.qhead .qc{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--wine);line-height:1}
.qbody{padding:2px 14px 16px;border-top:1px solid var(--sunk);margin-top:2px}
.qbody h3.mdh{margin-top:14px}
.meta .cat{background:var(--sunk);color:var(--ink2);padding:2px 7px;border-radius:99px;letter-spacing:.04em}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty h3{font-family:'Vollkorn',serif;font-size:19px;margin:0 0 6px;color:var(--ink)}
#toTop{position:fixed;right:16px;bottom:calc(var(--bot) + 14px);z-index:65;
  width:50px;height:50px;border-radius:50%;border:1px solid var(--rule);
  background:var(--raised);color:var(--wine);box-shadow:0 6px 18px -8px rgba(42,32,27,.6);
  display:none;align-items:center;justify-content:center;padding:0}
#toTop.show{display:flex}
#toTop:active{background:var(--sunk)}
#modal{position:fixed;inset:0;z-index:90;background:rgba(42,32,27,.55);
  display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--raised);border:1px solid var(--rule);border-radius:5px;
  padding:22px 20px;max-width:420px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#modal h3{font-family:'Vollkorn',serif;font-size:20px;font-weight:600;margin:0 0 8px;line-height:1.25}
#modal p{margin:0 0 6px;font-size:14.5px;color:var(--ink2)}
#modal .btn{width:100%;margin-top:10px}
#modal .danger{background:var(--wine);color:#FCF7EC;border-color:var(--wine)}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 14px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:4px;
  font-size:14px;z-index:80;display:none;max-width:88vw;text-align:center}
#float{position:fixed;z-index:70;transform:translate(-50%,-100%);background:var(--ink);
  color:var(--paper);border:none;border-radius:4px;padding:10px 15px;font-size:13.5px;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.5);display:none}
@media (min-width:760px){ .wrap{padding:30px 20px 60px} .art{padding:26px 28px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.head,.nav,.tools,.toc,#float,#toast,#toTop{display:none!important}
  body{padding:0;background:#fff}.art{break-inside:avoid;box-shadow:none;border:none;border-bottom:1px solid #ccc}}
</style>
</head>
<body>

<header class="head">
  <div class="brand">Дълбок <i>Прочит</i></div>
  <div class="hsub" id="htitle"></div>
</header>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<button id="toTop" aria-label="Нагоре"></button>
<button id="float"></button>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   ДЪЛБОК ПРОЧИТ 2 — без рамки, без Babel, зарежда мигновено.
   Цената е свалена с три лоста: кеширане на общия контекст,
   Haiku за извличането, и нула продължения (дълъг max_tokens).
   ===================================================================== */

const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nf = n => n.toLocaleString("bg-BG");

function toast(m) {
  const t = $("#toast");
  t.textContent = m; t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(() => (t.style.display = "none"), 2400);
}

/* ---------- 1. ХРАНИЛИЩЕ (IndexedDB + резерви) ---------- */

const DB = (() => {
  let db = null, ready = null;
  const mem = new Map();
  function open() {
    if (ready) return ready;
    ready = new Promise(res => {
      let rq;
      try { rq = indexedDB.open("dulbok-prochit", 1); }
      catch (e) { return res(null); }
      rq.onupgradeneeded = () => { rq.result.createObjectStore("kv"); };
      rq.onsuccess = () => { db = rq.result; res(db); };
      rq.onerror = () => res(null);
      setTimeout(() => res(db), 2500);
    });
    return ready;
  }
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction("kv", mode);
    const r = fn(t.objectStore("kv"));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return {
    async get(k) {
      await open();
      if (db) { try { const v = await tx("readonly", s => s.get(k)); return v === undefined ? null : v; } catch (e) {} }
      try { const v = localStorage.getItem("dp:" + k); return v ? JSON.parse(v) : (mem.has(k) ? mem.get(k) : null); }
      catch (e) { return mem.has(k) ? mem.get(k) : null; }
    },
    async set(k, v) {
      mem.set(k, v);
      await open();
      if (db) { try { await tx("readwrite", s => s.put(v, k)); return; } catch (e) {} }
      try { localStorage.setItem("dp:" + k, JSON.stringify(v)); } catch (e) {}
    },
    async del(k) {
      mem.delete(k);
      await open();
      if (db) { try { await tx("readwrite", s => s.delete(k)); } catch (e) {} }
      try { localStorage.removeItem("dp:" + k); } catch (e) {}
    },
    /* чете по точен ключ — за книгите, записани от предишната версия */
    async raw(k) {
      await open();
      if (db) { try { const v = await tx("readonly", s => s.get(k)); if (v !== undefined) return v; } catch (e) {} }
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    }
  };
})();

const IDX = "index";
const bkey = id => "book:" + id;
const JOB = "job";

/* ---------- 2. НАСТРОЙКИ ---------- */

const MODELS = {
  "claude-haiku-4-5-20251001": { name: "Haiku 4.5", in: 1, out: 5, speed: 1 },
  "claude-sonnet-5": { name: "Sonnet 5", in: 2, out: 10, speed: 1.6 },
  "claude-opus-5": { name: "Opus 5", in: 5, out: 25, speed: 2.6 }
};
const ls = (k, d) => { try { return localStorage.getItem("dpc:" + k) ?? d; } catch (e) { return d; } };
const lset = (k, v) => { try { localStorage.setItem("dpc:" + k, v); } catch (e) {} };

const CFG = {
  get source() { return ls("source", "key"); },        /* key | claude */
  set source(v) { lset("source", v); },
  get key() { return ls("key", ""); },
  set key(v) { lset("key", v); },
  get auto() { return ls("auto", "1") === "1"; },
  set auto(v) { lset("auto", v ? "1" : "0"); },
  get readModel() { return ls("readModel", "claude-haiku-4-5-20251001"); },
  set readModel(v) { lset("readModel", v); },
  get thinkModel() { return ls("thinkModel", "claude-sonnet-5"); },
  set thinkModel(v) { lset("thinkModel", v); },
  get depth() { return ls("depth", "normal"); },        /* light | normal | deep */
  set depth(v) { lset("depth", v); },
  get chatModel() { return ls("chatModel", "claude-sonnet-5"); },
  set chatModel(v) { lset("chatModel", v); }
};

/* ---------- 3. ВРЪЗКА С МОДЕЛА ---------- */

const USE = { in: 0, out: 0, cr: 0, cw: 0, calls: 0, cost: 0 };
let LAST_STOP = "";
let CANCEL = false;

function addUsage(model, u) {
  if (!u) return;
  const m = MODELS[model] || MODELS["claude-sonnet-5"];
  const i = u.input_tokens || 0, o = u.output_tokens || 0;
  const cw = u.cache_creation_input_tokens || 0, cr = u.cache_read_input_tokens || 0;
  USE.in += i; USE.out += o; USE.cw += cw; USE.cr += cr; USE.calls++;
  USE.cost += (i * m.in + cw * m.in * 1.25 + cr * m.in * 0.1 + o * m.out) / 1e6;
}

async function call(model, user, opts) {
  opts = opts || {};
  if (CANCEL) throw new Error("__cancel__");
  const head = opts.system || SYSTEM;
  const sys = opts.cache
    ? [{ type: "text", text: head }, { type: "text", text: opts.cache, cache_control: { type: "ephemeral" } }]
    : head;
  const headers = { "content-type": "application/json" };
  if (CFG.source === "key") {
    if (!CFG.key) { const e = new Error("Няма въведен API ключ."); e.needKey = true; e.fatal = true; throw e; }
    headers["x-api-key"] = CFG.key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const body = JSON.stringify({
    model, max_tokens: opts.max || 8000, system: sys,
    messages: Array.isArray(user) ? user : [{ role: "user", content: user }]
  });

  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body });
  } catch (e) {
    const err = new Error(navigator.onLine
      ? "Заявката не тръгна. Ако файлът е отворен направо от папката (file://), браузърът я блокира — пусни го през прост локален сървър."
      : "Няма интернет. Анализът иска връзка; вече готовите книги се четат и офлайн.");
    err.fatal = true; throw err;
  }
  if (!res.ok) {
    let d = ""; try { d = (await res.text()).slice(0, 240); } catch (e) {}
    const err = new Error("HTTP " + res.status + (d ? " · " + d : ""));
    err.status = res.status;
    if (res.status === 401 || res.status === 403) { err.needKey = true; err.fatal = true; }
    throw err;
  }
  const data = await res.json();
  addUsage(model, data.usage);
  LAST_STOP = data.stop_reason || "";
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
}

/* Дописване: моделът е спрял, защото е опрял в тавана, а не защото е свършил.
   Продължението стъпва на кеша, затова е евтино. */
async function ask(model, user, opts) {
  opts = opts || {};
  const cont = opts.cont == null ? 1 : opts.cont;
  const base = () => Array.isArray(user) ? user.slice() : [{ role: "user", content: user }];
  let out = "";
  let msgs = base();

  for (let pass = 0; pass <= cont; pass++) {
    const part = await attempt(model, msgs, opts);
    out = out ? out.replace(/\s+$/, "") + (/[.!?:»"”]$/.test(out.trim()) ? "\n\n" : " ") + part : part;
    if (LAST_STOP !== "max_tokens" || !part.trim()) break;
    if (pass === cont) {
      out += "\n\n*(отговорът е съкратен — питай „продължи“, за да го дописва)*";
      break;
    }
    msgs = base().concat([
      { role: "assistant", content: out },
      { role: "user", content: "Продължи точно оттам, където спря — по средата на изречението, ако е нужно. Без увод и без да повтаряш вече написаното." }
    ]);
  }
  return out;
}

async function attempt(model, msgs, opts) {
  let last = null;
  for (let a = 0; a < 3; a++) {
    try { return await call(model, msgs, opts); }
    catch (e) {
      if (e.message === "__cancel__" || e.fatal) throw e;
      last = e;
      if (e.status && e.status >= 400 && e.status < 500 && e.status !== 429) throw e;
      await sleep((e.status === 429 ? 3000 : 1000) * (a + 1));
    }
  }
  throw last;
}

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let n = 0;
  const w = async () => {
    while (true) {
      const i = n++;
      if (i >= items.length) return;
      if (CANCEL) throw new Error("__cancel__");
      out[i] = await fn(items[i], i);
    }
  };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, w));
  return out;
}

function clean(s) {
  return String(s || "")
    .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, "")
    .replace(/([^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g, "$1")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, " ")
    .replace(/\uFFFD/g, "")
    .replace(/[ \t\u00A0]+/g, " ")
    .replace(/\n{3,}/g, "\n\n");
}
function fit(t, max) {
  t = String(t || "");
  if (t.length <= max) return t;
  const c = t.slice(0, max), b = c.lastIndexOf("\n\n");
  return (b > max * 0.6 ? c.slice(0, b) : c) + "\n[…]";
}
function stripHeads(text) {
  const lines = text.split("\n"), f = {};
  lines.forEach(l => { const t = l.trim(); if (t.length > 3 && t.length < 90) f[t] = (f[t] || 0) + 1; });
  const junk = new Set(Object.keys(f).filter(k => f[k] > 6));
  return lines.filter(l => !junk.has(l.trim())).join("\n");
}
function chunkText(text, size) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const cut = Math.max(text.lastIndexOf("\n\n", end), text.lastIndexOf(". ", end));
      if (cut > i + size * 0.6) end = cut + 1;
    }
    out.push(text.slice(i, end));
    i = end;
  }
  return out.filter(p => p.replace(/\s/g, "").length > 300);
}
/* знаци на токен — кирилицата дели на повече токени от латиницата */
function charsPerToken(text) {
  const s = text.slice(0, 40000);
  const cyr = (s.match(/[\u0400-\u04FF]/g) || []).length / Math.max(1, s.length);
  return cyr > 0.3 ? 2.6 : 3.9;
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_W = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function loadPdf() {
  return new Promise((res, rej) => {
    if (window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = PDFJS;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W; res(window.pdfjsLib); };
    s.onerror = () => rej(new Error("PDF четецът не се зареди — трябва интернет само първия път."));
    document.head.appendChild(s);
  });
}
async function pdfToText(file, onp) {
  const lib = await loadPdf();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const parts = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const c = await pg.getTextContent();
    parts.push(c.items.map(i => i.str).join(" "));
    if (p % 10 === 0 || p === doc.numPages) { onp(p, doc.numPages); await sleep(0); }
  }
  return { text: parts.join("\n\n"), pages: doc.numPages };
}

function parseJSON(raw) {
  let t = String(raw || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = t.indexOf("["), o = t.indexOf("{");
  const s = a >= 0 && (a < o || o < 0) ? a : o;
  const e = t.lastIndexOf("]") > t.lastIndexOf("}") ? t.lastIndexOf("]") : t.lastIndexOf("}");
  if (s >= 0 && e > s) t = t.slice(s, e + 1);
  try { return JSON.parse(t); } catch (x) { return null; }
}

   четат едни и същи числа, за да не се разминават никога пак. */
const MAXT = { digest: 6000, merge: 6000, map: 5000, list: 1500, concepts: 8000, trio: 5000, syn: 5000, cond: 8000, memo: 4000, expl: 4000, chat: 5000 };
const CTX3_CAP_TOK = 7000;   /* колко от концепциите влизат в кеширания контекст */
const CTX3_CAP_CH = 18000;

const DEPTH = { light: { c: [5, 7] }, normal: { c: [7, 10] }, deep: { c: [10, 14] } };

function buildPlan(text, scan, ov) {
  ov = ov || {};
  const cpt = charsPerToken(text);
  const tok = Math.round(text.length / cpt);
  const kind = (scan && scan.kind) || "практическа";
  const dens = (scan && scan.density) || "средна";

  /* дълбочина: художественото иска по-малко концепции, плътната теория — повече */
  let depth = CFG.auto
    ? (kind === "художествена" || kind === "мемоари" ? "light" : dens === "висока" ? "deep" : "normal")
    : CFG.depth;

  /* модели: извличането е механична работа → Haiku; анализът иска повече ум.
     Автоматичният режим никога не избира Opus сам — той е 2.5 пъти по-скъп
     на изход и точно това вдигаше сметката без предупреждение. Стои като
     изричен избор във варианта „Максимален“, където цената се вижда. */
  let read = CFG.auto ? "claude-haiku-4-5-20251001" : CFG.readModel;
  let think = CFG.auto ? "claude-sonnet-5" : CFG.thinkModel;
  /* малка книга: няма смисъл от икономии, чети я направо с умния модел */
  if (CFG.auto && tok < 25000) read = think;

  if (ov.depth) depth = ov.depth;
  if (ov.read) read = ov.read;
  if (ov.think) think = ov.think;

  let concepts = Math.round((DEPTH[depth].c[0] + DEPTH[depth].c[1]) / 2);
  if (ov.concepts) concepts = ov.concepts;
  const perCall = 2;
  const chunkChars = Math.round((read.includes("haiku") ? 55000 : 40000) * (cpt / 3));
  const chunks = Math.max(1, Math.ceil(text.length / chunkChars));

  /* ---- прогноза ----
     Три неща правеха старата сметка два-три пъти по-ниска от истината:
     изходът се броеше по 1500 токена на концепция (реално стигат тавана),
     кешираният контекст се броеше веднъж, а той расте на три стъпки
     (суровина → +карта → +концепции), и всеки нов префикс е нов запис. */
  const inC = m => MODELS[m].in, outC = m => MODELS[m].out;

  const digOut = Math.min(MAXT.digest, Math.round((tok / chunks) / 6));
  const digIn = tok + chunks * 260;
  const digestTok = digOut * chunks;
  const needMerge = digestTok * 3.2 > 78000;
  const mergeGroups = needMerge ? Math.ceil((digestTok * 3.2) / 70000) : 0;
  const digestKept = needMerge ? Math.min(digestTok, 26000) : digestTok;

  const batches = Math.ceil(concepts / perCall);
  /* реален изход: моделът пълни между 65% и 90% от тавана */
  const REDO_F = 1.15; /* част от заявките се дописват веднъж */
  const outMap = Math.round(MAXT.map * 0.8);
  const outConcepts = batches * Math.min(MAXT.concepts, Math.round(2700 * perCall));
  const outTrio = 3 * Math.round(MAXT.trio * 0.85);
  const outFin = Math.round((MAXT.syn + MAXT.cond + MAXT.memo + MAXT.expl) * 0.8);
  const outThink = Math.round((outMap + outConcepts + outTrio + outFin) * REDO_F);

  /* три кеширани префикса, всеки със свой запис */
  const ctx1 = digestKept + 400;
  const ctx2 = ctx1 + outMap;
  const ctx3 = ctx2 + Math.min(CTX3_CAP_TOK, Math.round(outConcepts * 0.45));
  const writes = ctx1 + ctx2 + ctx3;
  const reads = ctx2 * batches + ctx3 * 6;

  const cost =
    (digIn * inC(read) + digestTok * outC(read)) / 1e6 +
    (needMerge ? (digestTok * inC(read) + digestTok * 0.55 * outC(read)) / 1e6 : 0) +
    (writes * 1.25 * inC(think) + reads * 0.1 * inC(think)) / 1e6 +
    (outThink * outC(think)) / 1e6 +
    0.02; /* сканиране, сверяване на картата и дребни заявки */

  const analysisCalls = batches + 8;
  const par = 6;
  const secs = (chunks / par) * 22 * MODELS[read].speed + (mergeGroups / 3) * 25 +
    (2 + batches + 2 + 3) * 16 * MODELS[think].speed;

  return {
    tok, kind, dens, depth, read, think, concepts, perCall, chunkChars, chunks,
    needMerge, calls: chunks + mergeGroups + analysisCalls + 1,
    cost, minutes: Math.max(1, Math.round(secs / 60)), par
  };
}

/* ---------- 6б. СЪВЕТ: кой модел и коя дълбочина, и защо ---------- */

function variants(text, scan) {
  const rec = buildPlan(text, scan);
  const eco = buildPlan(text, scan, {
    read: "claude-haiku-4-5-20251001", think: "claude-haiku-4-5-20251001",
    depth: "light", concepts: Math.max(5, rec.concepts - 2)
  });
  const max = buildPlan(text, scan, {
    read: rec.read, think: "claude-opus-5",
    depth: "deep", concepts: Math.min(14, rec.concepts + 3)
  });
  return { eco, rec, max };
}

/* Обяснението е сглобено от същите правила, по които се взима решението —
   не е отделен текст, който може да се разминава с реалността. */
function reasons(pl, scan) {
  const kind = pl.kind, dens = pl.dens;
  const r = [];

  r.push({
    t: "Четене: " + MODELS[pl.read].name,
    d: pl.read.includes("haiku")
      ? "През този модел минава целият текст на книгата — ${tok} токена. Работата тук е извличане: намери тезите, понятията, числата и примерите. Това не иска разсъждение, а внимание, и Haiku го върши на $1 за милион токена вместо $2 или $5. Оттук идва по-голямата част от икономията."
        .replace("${tok}", nf(pl.tok))
      : "Книгата е достатъчно малка, за да няма смисъл от икономия — чете я направо моделът, който после и мисли. Спестява едно ниво прехвърляне и суровината излиза по-точна."
  });

  r.push({
    t: "Анализ: " + MODELS[pl.think].name,
    d: pl.think.includes("opus")
      ? "Изрично избран за плътен текст. Свързва идеите по-добре от Sonnet, но изходът му се плаща 2.5 пъти по-скъпо, а именно изходът е основната част от сметката при анализ. Струва си при теоретично натоварена книга, която ще ти трябва дълго."
      : pl.think.includes("haiku")
        ? "Избран е най-евтиният и за анализа. Ще получиш вярна карта и коректни концепции, но връзките между идеите и критичният раздел ще са по-плоски."
        : kind === "художествена" || kind === "мемоари"
          ? "Художественият текст няма аргументативен скелет за разплитане — има мотиви и случки. Sonnet се справя с това; Opus не би добавил достатъчно, за да оправдае двойната цена."
          : dens === "висока"
            ? "Плътността е висока и Opus би свързал идеите малко по-добре, но не го избирам сам — на изход е 2.5 пъти по-скъп, а изходът е главното в сметката. Ако книгата ти трябва задълго, пусни варианта „Максимален“."
            : "Балансът за практическа книга със средна плътност. Opus си струва само когато текстът е теоретично натоварен."
  });

  r.push({
    t: pl.concepts + " концепции",
    d: kind === "художествена" || kind === "мемоари"
      ? "Мемоарите и художественото рядко държат повече от 5-7 носещи идеи. Повече концепции тук значи повторение с други думи, а всяка струва пари."
      : dens === "висока"
        ? "При тази плътност книгата носи повече самостоятелни идеи, отколкото се събират в 8 раздела. Свиването им би слепило различни неща в едно."
        : "Толкова обикновено побират носещите идеи на практическа книга, без да се стигне до разтягане."
  });

  r.push({
    t: pl.chunks + " части, по " + pl.par + " наведнъж",
    d: "Частите се четат едновременно, затова времето не расте право пропорционално на дебелината. По-едри части значат по-малко заявки, но и по-грубо извличане — размерът е нагласен според модела, който чете."
  });

  r.push({
    t: "Кеширан общ контекст",
    d: "Суровината и картата се пращат веднъж и се маркират за кеш. Всяка следваща от ~" + (pl.calls - pl.chunks) + " заявки ги чете на 10% от цената, вместо да ги плаща наново. Без това същият анализ струва между три и пет пъти повече."
  });

  if (scan && scan.catch) r.push({ t: "Особеното при тази книга", d: String(scan.catch) });
  return r;
}

/* ---------- 6в. ТЪРСЕНЕ В ПЪЛНИЯ ТЕКСТ ----------
   Работи изцяло в устройството, без заявка и без пари. Думите се режат
   до корен, за да съвпаднат „срещи“, „среща“ и „срещите“. */

const STOP = new Set(["това", "като", "която", "който", "което", "които", "защо", "какво", "каква", "какви", "мога", "трябва", "имам", "има", "съм", "бъде", "може", "след", "при", "över", "върху", "според", "тази", "този", "тези", "една", "един", "едно", "най", "все", "със", "без", "или", "ако", "тъй", "там", "тук", "той", "тя", "аз", "ми", "си", "се", "да", "на", "за", "от", "по", "до", "че", "но", "и", "в", "с", "а"]);

function stem(w) {
  w = w.toLowerCase().replace(/[^\wа-яё]/gi, "");
  if (w.length < 4) return "";
  if (STOP.has(w)) return "";
  return w.slice(0, Math.max(4, Math.min(6, w.length - 1)));
}

function windows(text, size) {
  const out = [];
  const paras = text.split(/\n\s*\n/);
  let buf = "";
  for (const p of paras) {
    if ((buf + p).length > size && buf) { out.push(buf); buf = ""; }
    buf += (buf ? "\n\n" : "") + p;
    while (buf.length > size * 1.8) { out.push(buf.slice(0, size)); buf = buf.slice(size); }
  }
  if (buf.trim()) out.push(buf);
  return out;
}

async function retrieve(book, question, take) {
  let full = null;
  try { full = await DB.get("full:" + book.id); } catch (e) {}
  if (!full) return null;
  const qs = question.split(/\s+/).map(stem).filter(Boolean);
  if (!qs.length) return null;
  const want = new Set(qs);
  const parts = windows(full, 1400);
  const scored = parts.map((p, i) => {
    const seen = new Set(p.split(/\s+/).map(stem).filter(Boolean));
    let hit = 0;
    want.forEach(w => { if (seen.has(w)) hit++; });
    /* дребен бонус за откъс, който съдържа числа — там обикновено са доказателствата */
    const num = /\d/.test(p) ? 0.4 : 0;
    return { i, p, s: hit + num };
  }).filter(x => x.s >= 1).sort((a, b) => b.s - a.s).slice(0, take || 4);
  if (!scored.length) return null;
  return scored.sort((a, b) => a.i - b.i).map(x => "…" + x.p.trim() + "…").join("\n\n---\n\n");
}

/* ---------- 7. КОНВЕЙЕР (с точки на възстановяване) ---------- */

const GROUPS = ["Карта", "Концепции", "Връзки и критика", "Концентрат"];
let JOBDATA = null;

async function saveJob() { if (JOBDATA) await DB.set(JOB, JOBDATA); }

async function once(key, fn) {
  if (JOBDATA.res[key] != null) return JOBDATA.res[key];
  const v = await fn();
  JOBDATA.res[key] = v;
  JOBDATA.usage = { ...USE };
  await saveJob();
  return v;
}

function log(text, cls) {
  JOBDATA.log.push({ text, cls });
  if (SCREEN === "run") paintRun();
}
function stat(s) { JOBDATA.stat = s; if (SCREEN === "run") paintRun(); }
function pct(p) { JOBDATA.pct = Math.max(JOBDATA.pct, Math.min(99, Math.round(p))); if (SCREEN === "run") paintRun(); }

async function addSection(sec) {
  const b = JOBDATA.book;
  if (b.sections.some(s => s.id === sec.id)) return;
  b.sections.push(sec);
  await persistBook(b);
  await saveJob();
}

/* Първата заявка с нов кеширан контекст го записва, останалите го четат
   на 10%. Пусне ли се цяла вълна наведнъж, всяка пише свое копие — затова
   първата тръгва сама и чак после идват другите. */
async function warmPool(items, limit, fn) {
  if (!items.length) return [];
  const first = await fn(items[0], 0);
  const rest = await pool(items.slice(1), limit, (it, i) => fn(it, i + 1));
  return [first].concat(rest);
}

/* Само същественото от концепциите влиза в кеша за последните раздели —
   пълните текстове го надуваха с 40 000 знака. */
function condenseConcepts(list) {
  return list.map(c => {
    const b = String(c.body || "");
    const m = b.match(/###\s*Какво да запомниш\s*([\s\S]*?)(?=\n###|$)/);
    const gist = m ? m[1].trim() : b.slice(0, 700);
    const claim = (b.match(/###\s*Какво точно твърди авторът\s*([\s\S]*?)(?=\n###|$)/) || [, ""])[1].trim().slice(0, 700);
    return "### " + c.name + "\n" + claim + "\n" + gist;
  }).join("\n\n");
}

async function runJob() {
  const J = JOBDATA;
  const pl = J.plan;
  const text = J.text;
  CANCEL = false;
  J.running = true;

  /* 1. Извличане на суровината — паралелно, с евтиния модел */
  const chunks = chunkText(text, pl.chunkChars);
  if (!J.res.dig) J.res.dig = [];
  let doneN = J.res.dig.filter(x => x != null).length;
  if (doneN < chunks.length) log("Чета книгата на " + chunks.length + " части с " + MODELS[pl.read].name);
  const times = [];
  await pool(chunks, pl.par, async (c, i) => {
    if (J.res.dig[i] != null) return;
    const t = Date.now();
    try {
      J.res.dig[i] = await ask(pl.read, P.digest(c, i + 1, chunks.length), { max: MAXT.digest });
    } catch (e) {
      if (e.message === "__cancel__" || e.fatal) throw e;
      J.res.dig[i] = "";
      J.res.missed = (J.res.missed || []).concat([i + 1]);
      log("Част " + (i + 1) + " не се прочете — продължавам без нея", "warn");
    }
    times.push(Date.now() - t);
    doneN++;
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    const left = Math.round(((chunks.length - doneN) / pl.par) * avg / 1000);
    stat("Прочетени " + doneN + "/" + chunks.length + " · остават ~" + (left > 90 ? Math.ceil(left / 60) + " мин" : Math.max(left, 5) + " сек"));
    pct(4 + (doneN / chunks.length) * 40);
    J.usage = { ...USE };
    await saveJob();
  });

  /* 2. Свиване до работна суровина */
  let level = J.res.dig.filter(d => d && d.trim());
  if (!level.length) throw new Error("Нито една част не беше прочетена.");
  let round = 0;
  while (level.join("\n\n").length > 78000 && round < 3) {
    const per = Math.max(2, Math.ceil(level.length / Math.ceil(level.join("").length / 70000)));
    const groups = [];
    for (let i = 0; i < level.length; i += per) groups.push(level.slice(i, i + per).join("\n\n"));
    if (groups.length >= level.length) break;
    log("Сливам прочетеното: " + level.length + " → " + groups.length);
    stat("Сливам прочетеното");
    const rk = "mg" + round;
    level = await once(rk, () => pool(groups, 3, g => ask(pl.read, P.merge(fit(g, 90000)), { max: MAXT.merge })));
    round++;
  }
  const digest = fit(level.join("\n\n"), 78000);
  pct(48);

  /* Общият контекст се кешира — оттук нататък всяка заявка го чете
     на 10% от цената, вместо да го плаща наново. */
  const CTX = "Ето суровината, извлечена от цялата книга „" + (J.book.title || "") + "“.\n\n" + digest;

  /* 3. Карта */
  stat("Картата на книгата");
  log("Изграждам картата на идеите с " + MODELS[pl.think].name);
  const map0 = await once("map", () => ask(pl.think, P.map.replace("{{N}}", pl.depth === "light" ? "6-8" : pl.depth === "deep" ? "10-15" : "8-12"), { cache: CTX, max: MAXT.map }));

  /* Всичко нататък стъпва на картата, затова я сверяваме със суровината,
     преди да е станала основа на петнайсет раздела. */
  stat("Сверявам картата със суровината");
  const map = await once("mapfix", async () => {
    let v = null;
    try {
      v = parseJSON(await ask(pl.read, P.verify(map0), { cache: CTX, max: 900, cont: 0 }));
    } catch (e) { return map0; }
    if (!v || v.ok !== false || !Array.isArray(v.issues) || !v.issues.length) {
      log("Картата съвпада със суровината");
      J.res.mapIssues = [];
      return map0;
    }
    J.res.mapIssues = v.issues.slice(0, 5);
    log("Поправям " + J.res.mapIssues.length + " разминавания в картата", "warn");
    try {
      return await ask(pl.think, P.fixmap(map0, J.res.mapIssues), { cache: CTX, max: MAXT.map });
    } catch (e) { return map0; }
  });
  J.book.mapIssues = J.res.mapIssues || [];
  await addSection({ id: "map", group: 0, title: "Карта на книгата", body: map });
  pct(54);

  /* Картата влиза в кеша, за да не се праща наново при всяка концепция */
  const CTX2 = CTX + "\n\n=== КАРТА НА КНИГАТА ===\n" + map;

  /* 4. Концепции — по няколко в една заявка */
  stat("Избирам концепциите");
  let list = await once("list", async () => {
    const v = parseJSON(await ask(pl.think, P.list(pl.concepts), { cache: CTX2, max: MAXT.list, cont: 0 }));
    return Array.isArray(v) && v.length ? v.filter(x => x && x.name).slice(0, 14) : [{ name: "Основната теза", why: "носещата идея" }];
  });

  const batches = [];
  for (let i = 0; i < list.length; i += pl.perCall) batches.push(list.slice(i, i + pl.perCall));
  stat("Разгръщам концепциите");
  let bdone = 0;
  const parsedAll = [];
  for (let bi = 0; bi < batches.length; bi++) {
    const names = batches[bi].map(x => x.name);
    const raw = await once("cb" + bi, () => ask(pl.think, P.concepts(names), { cache: CTX2, max: MAXT.concepts }));
    const parts = String(raw).split(/^@@\s*/m).map(s => s.trim()).filter(Boolean);
    for (let k = 0; k < names.length; k++) {
      const p = parts[k] || "";
      const nl = p.indexOf("\n");
      const body = nl > 0 ? p.slice(nl + 1).trim() : p;
      parsedAll.push({ name: names[k], body: body || "Тази концепция не се получи — пусни анализа пак." });
      await addSection({ id: "c" + (bi * pl.perCall + k), group: 1, title: names[k], body: body || "…" });
    }
    bdone += names.length;
    stat("Концепции: " + bdone + "/" + list.length);
    pct(54 + (bdone / list.length) * 22);
  }
  /* в кеша влиза само същественото от концепциите, не пълните текстове */
  const CTX3 = CTX2 + "\n\n=== СЪЩНОСТТА НА КОНЦЕПЦИИТЕ ===\n" + fit(condenseConcepts(parsedAll), CTX3_CAP_CH);

  /* 5. Връзки, аргументация, критика.
     Първата загрява кеша, другите две вървят заедно. Всяка се записва
     сама за себе си — падне ли една, останалите не се плащат наново. */
  stat("Връзки, аргументация, критика");
  log("Свързвам идеите и проверявам аргументацията");
  const links = await once("links", () => ask(pl.think, P.links, { cache: CTX3, max: MAXT.trio }));
  await addSection({ id: "links", group: 2, title: "Как се свързват идеите", body: links });
  const pair = await pool([["arg", P.argument], ["crit", P.critique]], 2,
    x => once(x[0], () => ask(pl.think, x[1], { cache: CTX3, max: MAXT.trio })));
  await addSection({ id: "arg", group: 2, title: "Структура на аргументацията", body: pair[0] });
  await addSection({ id: "crit", group: 2, title: "Критичен анализ", body: pair[1] });
  pct(84);

  /* 6. Синтез и концентрат */
  stat("Пиша концентрата");
  const syn = await once("syn", () => ask(pl.think, P.synthesis, { cache: CTX3, max: MAXT.syn }));
  await addSection({ id: "syn", group: 2, title: "Книгата като цяло", body: syn });
  const fin = await pool([
    ["cond", P.condensed, MAXT.cond],
    ["memo", P.memory, MAXT.memo],
    ["expl", P.explain, MAXT.expl]
  ], 3, x => once(x[0], () => ask(pl.think, x[1], { cache: CTX3, max: x[2] })));
  await addSection({ id: "cond", group: 3, title: "Книгата в 20 минути", body: fin[0] });
  await addSection({ id: "memo", group: 3, title: "Какво трябва да запомниш", body: fin[1] });
  await addSection({ id: "expl", group: 3, title: "Ако трябва да обясниш книгата на друг", body: fin[2] });

  /* остава за чата „Попитай книгата“ — суровината и картата, без пълния PDF */
  J.book.ctx = fit(CTX2, 70000);
  /* пълният текст се пази отделно: нужен е само при изрична проверка в оригинала */
  try {
    await DB.set("full:" + J.book.id, fit(text, 1600000));
    J.book.hasFull = true;
  } catch (e) { J.book.hasFull = false; }
  J.book.coverage = {
    parts: chunks.length,
    missed: (J.res.missed || []).slice(),
    merged: round > 0
  };
  J.book.done = true;
  J.book.cost = USE.cost;
  J.book.estimate = pl.cost;
  await persistBook(J.book);
  J.pct = 100;
  J.running = false;
  J.finished = true;
  await DB.del(JOB);
  const mins = Math.round((Date.now() - J.startedAt) / 60000);
  log("Готово за " + (mins < 1 ? "под минута" : mins + " мин") + " · " + money(USE.cost));
}

function money(c) { return "$" + c.toFixed(2) + " (~" + (c * 0.92).toFixed(2) + " €)"; }

/* ---------- 7б. ПРЕЗАРЕЖДАНЕ НА ЕДИН РАЗДЕЛ ----------
   Контекстът се сглобява наново от вече запазеното, така че цената
   е една заявка вместо целия анализ. */

function ctxFor(b, id) {
  const base = b.ctx || ("Ето анализа на книгата „" + b.title + "“.");
  if (id === "map" || /^c\d+$/.test(id)) return base;
  const con = b.sections.filter(s => s.group === 1)
    .map(s => ({ name: s.title, body: s.body }));
  return base + "\n\n=== СЪЩНОСТТА НА КОНЦЕПЦИИТЕ ===\n" + fit(condenseConcepts(con), CTX3_CAP_CH);
}

const REDO = {
  map: () => P.map.replace("{{N}}", "8-12"),
  links: () => P.links,
  arg: () => P.argument,
  crit: () => P.critique,
  syn: () => P.synthesis,
  cond: () => P.condensed,
  memo: () => P.memory,
  expl: () => P.explain
};
const REDO_MAX = { map: MAXT.map, links: MAXT.trio, arg: MAXT.trio, crit: MAXT.trio, syn: MAXT.syn, cond: MAXT.cond, memo: MAXT.memo, expl: MAXT.expl };

async function redoSection(id) {
  const b = BOOK;
  if (!b) return;
  const s = b.sections.find(x => x.id === id);
  if (!s) return;
  const model = (b.plan && b.plan.think) || CFG.thinkModel;
  const isConcept = /^c\d+$/.test(id);
  const prompt = isConcept ? P.concepts([s.title]) : (REDO[id] ? REDO[id]() : null);
  if (!prompt) return toast("Този раздел не може да се пусне сам");

  UI.redo = id;
  paintReader();
  const before = USE.cost;
  try {
    let out = await ask(model, prompt, { cache: ctxFor(b, id), max: isConcept ? MAXT.concepts : (REDO_MAX[id] || 5000) });
    if (isConcept) {
      const parts = String(out).split(/^@@\s*/m).map(x => x.trim()).filter(Boolean);
      const p = parts[0] || out;
      const nl = p.indexOf("\n");
      out = nl > 0 && /^@@/.test("@@" + p) ? p.slice(nl + 1).trim() : p;
    }
    if (!out) throw new Error("празен отговор");
    s.body = out;
    b.cost = (b.cost || 0) + (USE.cost - before);
    await persistBook(b);
    toast("Разделът е презареден · " + money(USE.cost - before));
  } catch (e) {
    toast(e.needKey ? "Ключът не се приема" : "Не се получи: " + e.message);
  }
  UI.redo = null;
  paintReader();
}

async function importOld() {

const GRP = {

  "Как се свързват идеите": 2, "Структура на аргументацията": 2,

/* Разчита файла, който старата версия сваля с бутона „Свали“ */
function parseExport(text) {
  const lines = text.split("\n");
  let title = "", author = "", i = 0;
  for (; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (t.startsWith("# ")) { title = t.slice(2).trim(); i++; break; }
  }
  for (; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (t.startsWith("## ") || t === "---") break;
    if (!t.startsWith("_")) { author = t; i++; }
    break;
  }
  const sections = [];
  let cur = null, mode = "body";
  const push = () => { if (cur) { cur.body = cur.body.replace(/\n+---\s*$/, "").trim(); sections.push(cur); } };
  for (; i < lines.length; i++) {
    const raw = lines[i], t = raw.trim();
    if (t.startsWith("## ")) {
      push();
      cur = { title: t.slice(3).replace(/^★\s*/, "").trim(), body: "", notes: [] };
      mode = "body";
      continue;
    }
    if (!cur) continue;
    if (/^\*\*Мои бележки:?\*\*/.test(t)) { mode = "notes"; continue; }
    if (mode === "notes") {
      if (t.startsWith("> ")) cur.notes.push({ id: uid(), quote: t.slice(2).trim(), text: "", ts: Date.now() });
      else if (t.startsWith("- ")) cur.notes.push({ id: uid(), quote: "", text: t.slice(2).trim(), ts: Date.now() });
      else if (t === "---") mode = "body";
      continue;
    }
    if (t === "---") continue;
    cur.body += raw + "\n";
  }
  push();
  if (!sections.length) return null;
  const book = {
    id: uid(), title: title || "Внесен анализ", author, topic: "",
    createdAt: Date.now(), sections: [], ann: { fav: {}, notes: {}, read: {} }, done: true
  };
  sections.forEach((s, k) => {
    const id = "i" + k;
    book.sections.push({ id, group: GRP[s.title] != null ? GRP[s.title] : 1, title: s.title, body: s.body });
    if (s.notes.length) book.ann.notes[id] = s.notes;
  });
  return book;
}

/* Внасянето работи еднакво от файл и от залепен текст —
   съдържанието е едно и също, различен е само носителят. */
async function importText(text) {
  const t = String(text || "").trim();
  if (!t) return 0;
  if (t[0] === "{" || t[0] === "[") {
    const data = parseJSON(t);
    const arr = Array.isArray(data) ? data : data && data.books ? data.books : data ? [data] : [];
    let n = 0;
    for (const b of arr) {
      if (!b || !Array.isArray(b.sections)) continue;
      b.id = b.id || uid();
      b.ann = b.ann || { fav: {}, notes: {}, read: {} };
      await persistBook(b); n++;
    }
    return n;
  }
  const b = parseExport(t);
  if (!b) return 0;
  await persistBook(b);
  return 1;
}

}

function download(name, text, mime) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    return true;
  } catch (e) { return false; }
}

/* ---------- 9в. MARKDOWN ---------- */

function inline(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(text) {
  let html = "", list = null;
  const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
  String(text || "").split("\n").forEach(raw => {
    const t = raw.trim();
    if (!t) return close();
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
      close();
      const tag = m[1].length <= 2 ? "h3" : "h4";
      html += "<" + tag + ' class="mdh">' + inline(m[2]) + "</" + tag + ">";
      return;
    }
    if (/^(-{3,}|_{3,})$/.test(t)) { close(); html += "<hr>"; return; }
    if (/^>\s?/.test(t)) { close(); html += "<blockquote>" + inline(t.replace(/^>\s?/, "")) + "</blockquote>"; return; }
    if ((m = t.match(/^[-*•]\s+(.*)$/))) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>"; return;
    }
    if ((m = t.match(/^\d+[.)]\s+(.*)$/))) {
      if (list !== "ol") { close(); html += "<ol>"; list = "ol"; }
      html += "<li>" + inline(m[1]) + "</li>"; return;
    }
    close();
    html += "<p>" + inline(t) + "</p>";
  });
  close();
  return html;
}

/* --- попитай книгата --- */
const CHAT_SYSTEM = `Ти отговаряш на въпроси за една конкретна книга, въз основа на подаден материал от нея.

РЕД НА РАБОТА — спазваш го винаги:
1. Първо изчерпваш книгата. Търсиш в материала всичко, което се отнася до въпроса — пряко или косвено — и градиш отговора от него. Назоваваш принципите и понятията с имената, които авторът им дава.
2. Стигне ли книгата за пълен отговор, спираш дотук. Не добавяш нищо отвън.
3. Не стигне ли, казваш го изрично и чак тогава допълваш от собствените си знания — под отделно заглавие **Извън книгата**, за да е ясно докъде свършва авторът и откъде започваш ти.
4. Не съдържа ли книгата абсолютно нищо по темата, казваш го направо: „Книгата не разглежда това." Посочваш кое най-близко тя все пак казва, ясно отбелязано като най-близко, а не като отговор. Ако въпросът си заслужава, можеш да дадеш кратък отговор под **Извън книгата**.

ТОЧНОСТ:
- Не приписваш на автора нищо, което не е в материала. По-добре „книгата не казва", отколкото правдоподобно допълване.
- Не превръщаш свое тълкуване в негово твърдение.
- Ако книгата има особен или спорен ъгъл, предаваш нейния, не общоприетия.

ФОРМА:
- При въпрос за лична ситуация: кой принцип от книгата се отнася → какво значи той точно за описания случай → каква е следващата конкретна стъпка.
- На български, кратко и по същество. Без увод и без завършващи любезности.`;

function chatBook() { return CHAT.book; }

function paintAsk() {
  const done = INDEX.filter(b => b.sections > 0);
  const b = CHAT.book;
  const msgs = b && b.chat ? b.chat : [];

  /* въпросите и отговорите се събират по двойки и се сгъват */
  const turns = [];
  for (let i = 0; i < msgs.length; i++) {
    if (msgs[i].role === "user") {
      const a = msgs[i + 1] && msgs[i + 1].role === "assistant" ? msgs[i + 1] : null;
      turns.push({ q: msgs[i], a, i });
      if (a) i++;
    } else turns.push({ q: null, a: msgs[i], i });
  }
  if (CHAT.openTurn == null && turns.length) CHAT.openTurn = turns.length - 1;

  const samples = (b && b.samples && b.samples.length) ? b.samples : [];

  $("#app").innerHTML = `
  <div class="wrap">
    <h2 class="sec">${b ? esc(b.title) : "Попитай книгата"}</h2>
    <p class="hint">Първо изчерпва информацията в самата книга. Ако тя не е достатъчна, допълва с общи знания, като ясно ги отделя в секция „Извън книгата“, за да е видно коя информация произлиза от книгата и коя е допълнителна.</p>

    <label class="f">Книга</label>
    <select class="f" id="askBook">
      <option value="">— избери —</option>
      ${done.map(x => '<option value="' + x.id + '"' + (b && b.id === x.id ? " selected" : "") + ">" + esc(x.title) + "</option>").join("")}
    </select>
    ${done.length ? "" : '<p class="hint">Първо анализирай книга.</p>'}

    ${b ? `
      ${turns.length ? `<div id="chatBox" style="margin-top:18px">
        ${turns.map((t, ti) => {
          const open = CHAT.openTurn === ti;
          const q = t.q ? t.q.text : "(въпросът липсва)";
          return `<div class="turn ${open ? "open" : ""}">
            <button class="qhead" data-turn="${ti}">
              <span class="qn">${String(ti + 1).padStart(2, "0")}</span>
              <span class="qt">${esc(q)}</span>
              <span class="qc">${open ? "−" : "+"}</span>
            </button>
            ${open ? '<div class="qbody">' + (t.a ? md(t.a.text) : '<p class="hint">Няма отговор — пусни въпроса пак.</p>') +
              (t.a && t.a.deep ? '<p class="stat" style="margin-top:10px">проверено в пълния текст</p>' : "") +
              (t.a && !t.a.deep && b.hasFull
                ? '<button class="btn" data-deep="' + esc(t.q ? t.q.text : "") + '" style="margin-top:12px">' +
                  (NOTFOUND.test(t.a.text)
                    ? "Може да го има в книгата — провери в пълния текст"
                    : "Провери в пълния текст") + "</button>"
                : "") + "</div>" : ""}
          </div>`;
        }).join("")}
      </div>` : `
      <div class="card saf" style="margin-top:18px">
        <b class="disp" style="font-size:17px">Питай за своя случай</b>
        ${samples.length
          ? '<p class="hint" style="margin-top:6px">Ето какво тази книга може да ти каже:</p>' +
            samples.map(q => '<button class="btn wide" data-sample="' + esc(q) + '" style="margin-top:8px;text-align:left;justify-content:flex-start">' + esc(q) + "</button>").join("")
          : '<p class="hint" style="margin-top:6px">' + (CHAT.samplesBusy ? "Подготвям примери за тази книга…" : "Опиши реална ситуация от твоята работа, а не общ въпрос за книгата.") + "</p>"}
      </div>`}

      <textarea class="f" id="askInput" placeholder="Твоят въпрос…" style="margin-top:12px">${esc(CHAT.draft || "")}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn pri" data-act="asksend" ${CHAT.busy ? "disabled" : ""}>${CHAT.busy ? "Мисли…" : "Питай"}</button>
        ${turns.length ? '<button class="btn" data-act="askclear">Изчисти</button>' : ""}
      </div>
      <div class="stat" style="margin-top:12px">${MODELS[CFG.chatModel].name} · разговорът дотук ${money(CHAT.cost)}${b.hasFull ? " · пълният текст е запазен" : ""}</div>
      ${CHAT.err ? '<div class="err" style="margin-top:12px">' + esc(CHAT.err) + "</div>" : ""}
    ` : ""}
  </div>`;

  const sel = $("#askBook");
  if (sel) sel.onchange = async e => {
    const id = e.target.value;
    CHAT.openTurn = null; CHAT.err = null; CHAT.draft = "";
    if (!id) { CHAT.book = null; return paintAsk(); }
    const bk = await DB.get(bkey(id));
    if (!bk) return toast("Книгата не се намери");
    bk.ann = bk.ann || { fav: {}, notes: {}, read: {} };
    CHAT.book = bk;
    CHAT.cost = 0;
    paintAsk();
    ensureSamples(bk);
  };
  const ta = $("#askInput");
  if (ta) ta.oninput = e => { CHAT.draft = e.target.value; };
}

/* Примерните въпроси се правят веднъж на книга и се пазят с нея. */
async function ensureSamples(b) {
  if (!b || (b.samples && b.samples.length) || CHAT.samplesBusy) return;
  if (b.chat && b.chat.length) return;
  CHAT.samplesBusy = true;
  try {
    const gist = fit(
      (b.topic ? b.topic + "\n" : "") +
      b.sections.filter(s => s.group === 1).map(s => s.title).join("; ") + "\n" +
      (b.sections.find(s => s.id === "map") || { body: "" }).body,
      4000
    );
    const v = parseJSON(await ask("claude-haiku-4-5-20251001", P.samples(b.title, gist), { max: 400, cont: 0 }));
    if (Array.isArray(v) && v.length) {
      b.samples = v.filter(x => typeof x === "string").slice(0, 3);
      await persistBook(b);
    }
  } catch (e) { /* примери не са задължителни */ }
  CHAT.samplesBusy = false;
  if (SCREEN === "ask") paintAsk();
}

/* Контекстът е суровината и картата, събрани при анализа. За по-стари
   книги, при които ги няма, се ползват самите раздели на анализа. */
function chatContext(b) {
  if (b.ctx) return fit(b.ctx, 70000);
  return fit("Ето анализа на книгата „" + b.title + "“.\n\n" +
    b.sections.map(s => "=== " + s.title + " ===\n" + s.body).join("\n\n"), 70000);
}

async function askSend(deep) {
  const b = CHAT.book;
  const ta = $("#askInput");
  const q = ta ? ta.value.trim() : (CHAT.draft || "").trim();
  if (!b || !q || CHAT.busy) return;
  CHAT.busy = true; CHAT.err = null; CHAT.draft = "";
  b.chat = (b.chat || []).concat([{ role: "user", text: q, ts: Date.now(), deep: !!deep }]);
  await persistBook(b);
  CHAT.openTurn = null;
  paintAsk();

  let extra = "";
  if (deep) {
    const found = await retrieve(b, q, 4);
    if (found) extra = "\n\n=== ОТКЪСИ ОТ ОРИГИНАЛНИЯ ТЕКСТ, НАМЕРЕНИ ПО ТОЗИ ВЪПРОС ===\n" +
      fit(found, 9000) +
      "\n=== край на откъсите ===\nТези откъси са от самата книга и имат предимство пред обобщения материал. Ако съдържат конкретика — числа, имена, процедури — предай я точно.";
    else extra = "\n\n(Търсенето в пълния текст не намери подходящ откъс по този въпрос.)";
  }

  const hist = b.chat.slice(-12).map(m => ({
    role: m.role,
    content: m.role === "user" ? P.chat(b.title, m.text) : m.text
  }));
  if (extra) hist[hist.length - 1].content += extra;

  const before = USE.cost;
  try {
    const out = await ask(CFG.chatModel, hist, {
      system: CHAT_SYSTEM, cache: chatContext(b), max: MAXT.chat, cont: 2
    });
    b.chat = b.chat.concat([{ role: "assistant", text: out, ts: Date.now(), deep: !!deep }]);
    CHAT.cost += USE.cost - before;
    await persistBook(b);
  } catch (e) {
    CHAT.err = e.needKey ? "Ключът не се приема. Провери го в Настройки." : e.message;
  }
  CHAT.busy = false;
  CHAT.openTurn = null;
  paintAsk();
}

function visible() {
  const q = UI.q.trim().toLowerCase();
  return BOOK.sections.filter(s => {
    if (UI.onlyFav && !BOOK.ann.fav[s.id]) return false;
    if (!q) return true;

/* Каквото не е стигнало до анализа, читателят няма как да усети сам —
   затова непълното покритие се изписва, вместо да мълчи. */
function coverageNote(b) {
  let pre = "";
  if (b.mapIssues && b.mapIssues.length) {
    pre = '<div class="card"><p class="hint" style="margin:0"><b>Картата беше поправена.</b> Сверката със суровината намери ' +
      b.mapIssues.length + ' разминавания и те бяха отстранени, преди останалите раздели да стъпят на нея: ' +
      b.mapIssues.map(x => esc(String(x))).join(" · ") + "</p></div>";
  }
  const c = b.coverage;
  if (!c) return pre;
  const miss = (c.missed || []).length;
  if (!miss && !c.merged) return pre;
  let t = "";
  if (miss) {
    t += "<b>Непълно покритие.</b> " + miss + " от " + c.parts +
      " части не се прочетоха (" + c.missed.join(", ") + ") и не участват в анализа. " +
      "Каквото е било в тях, липсва навсякъде по-нататък. Пусни анализа наново, ако темата ти е важна.";
  } else {
    t += "<b>Как е стигнала книгата дотук.</b> Текстът е прочетен на " + c.parts +
      " части и после свит на няколко нива, за да се събере в един анализ. Свиването пази тезите, " +
      "понятията и най-силните примери, но подробности неизбежно отпадат — това е цената на компресията.";
  }
  return pre + '<div class="card ' + (miss ? "saf" : "") + '" style="margin-bottom:14px"><p class="hint" style="margin:0">' + t + "</p></div>";
}

    </div>
    ${UI.rename ? `<div class="card saf">
      <label class="f">Заглавие</label>
      <input class="f" id="rTitle" value="${esc(b.title)}">

  if (!b) return goto("library", false);
  const items = [];
  b.sections.forEach(s => (b.ann.notes[s.id] || []).forEach(n => items.push({ s, n })));

  <div class="wrap">

/* ---------- 11. ДЕЙСТВИЯ ---------- */

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-nav],[data-act],[data-open],[data-del],[data-goto],[data-fav],[data-note],[data-read],[data-copy],[data-savenote],[data-delnote],[data-src],[data-auto],[data-jump],[data-run],[data-cat],[data-sample],[data-turn],[data-redo],[data-deep]");
  if (!t) return;
  const d = t.dataset;

  if (d.nav) {
    if (d.nav === "back") return back();
    if (d.nav === "top") return window.scrollTo({ top: 0, behavior: "smooth" });
    if (d.nav === "notes") return goto("notes");
    if (d.nav === "run") return goto("run");
    if (d.nav === "library") { STACK = []; return goto("library", false); }
    if (d.nav === "help") return goto("help");
    if (d.nav === "ask") {
      if (!CHAT.book && BOOK) { CHAT.book = BOOK; CHAT.openTurn = null; }
      goto("ask");
      if (CHAT.book) ensureSamples(CHAT.book);
      return;
    }
    if (d.nav === "settings") return goto("settings");
  }

  if (d.open) {
    const b = await DB.get(bkey(d.open));
    if (!b) return toast("Книгата не се намери");
    b.ann = b.ann || { fav: {}, notes: {}, read: {} };
    BOOK = b; UI.q = ""; UI.open = {};
    return goto("reader");
  }
  if (d.del) {
    const b = INDEX.find(x => x.id === d.del);
    if (!b) return;
    askDelete(b);
    return;
  }
  if (d.goto) { const el = $("#s-" + d.goto); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.jump) {
    const id = d.jump;
    goto("reader");
    setTimeout(() => { const el = $("#s-" + id); if (el) el.scrollIntoView({ block: "start" }); }, 60);
    return;
  }
  if (d.fav) { BOOK.ann.fav[d.fav] = !BOOK.ann.fav[d.fav]; await persistBook(BOOK); return paintReader(); }
  if (d.read) { BOOK.ann.read[d.read] = !BOOK.ann.read[d.read]; await persistBook(BOOK); return paintReader(); }
  if (d.note) {
    UI.open[d.note] = !UI.open[d.note];
    paintReader();
    if (UI.open[d.note]) { const ta = $("#d-" + d.note); if (ta) { ta.focus(); ta.scrollIntoView({ block: "center" }); } }
    return;
  }
  if (d.copy) {
    const s = BOOK.sections.find(x => x.id === d.copy);
    try { await navigator.clipboard.writeText(s.title + "\n\n" + s.body); toast("Копирано"); }
    catch (err) { toast("Копирането е блокирано тук"); }
    return;
  }
  if (d.savenote) {
    const ta = $("#d-" + d.savenote);
    const v = ta ? ta.value.trim() : "";
    if (!v) return toast("Празна бележка");
    await addNote(d.savenote, v, "");
    return;
  }
  if (d.delnote) {
    const [sid, nid] = d.delnote.split("|");
    BOOK.ann.notes[sid] = (BOOK.ann.notes[sid] || []).filter(n => n.id !== nid);
    await persistBook(BOOK);
    return SCREEN === "notes" ? paintNotes() : paintReader();
  }
  if (d.src) { CFG.source = d.src; return paintSettings(); }
  if (d.auto) { CFG.auto = d.auto === "1"; return paintSettings(); }

  if (d.run) { startJob(d.run); return; }

  if (d.cat != null && t.hasAttribute("data-cat")) { UI.cat = d.cat; return paintLibrary(); }
  if (d.turn != null && t.hasAttribute("data-turn")) {
    const n = Number(d.turn);
    CHAT.openTurn = CHAT.openTurn === n ? -1 : n;
    return paintAsk();
  }
  if (d.redo) { redoSection(d.redo); return; }
  if (d.deep != null && t.hasAttribute("data-deep")) {
    CHAT.draft = d.deep;
    askSend(true);
    return;
  }
  if (d.sample) {
    CHAT.draft = d.sample;
    paintAsk();
    const ta = $("#askInput");
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }

  switch (d.act) {
    case "pick": PICKMODE = "run"; $("#file").click(); break;
    case "advise": PICKMODE = "advice"; $("#file").click(); break;
    case "advice": goto("advice"); break;
    case "delyes": doDelete(); break;
    case "delno": closeModal(); break;
    case "delsave": { const id = PENDING_DEL; closeModal(); if (id) saveCopyOf(id); break; }
    case "about": goto("about"); break;
    case "help": goto("help"); break;
    case "savemeta": {
      const t = $("#pTitle"), a = $("#pAuthor");
      if (t && t.value.trim()) PEND.title = t.value.trim().slice(0, 140);
      if (a) PEND.author = a.value.trim().slice(0, 90);
      toast("Запазено");
      paintPlan();
      break;
    }
    case "rename": UI.rename = !UI.rename; paintReader(); break;
    case "cancelrename": UI.rename = false; paintReader(); break;
    case "saverename": {
      const t = $("#rTitle"), a = $("#rAuthor");
      if (t && t.value.trim()) BOOK.title = t.value.trim().slice(0, 140);
      if (a) BOOK.author = a.value.trim().slice(0, 90);
      UI.rename = false;
      await persistBook(BOOK);
      if (CHAT.book && CHAT.book.id === BOOK.id) CHAT.book = BOOK;
      paint();
      toast("Преименувано");
      break;
    }
    case "asksend": askSend(false); break;
    case "askclear": {
      if (CHAT.book) {
        CHAT.book.chat = [];
        CHAT.cost = 0;
        await persistBook(CHAT.book);
        paintAsk();
      }
      break;
    }
    case "tolib": STACK = []; goto("library", false); break;
    case "howmade": {
      if (!BOOK || !BOOK.plan) return toast("За тази книга няма запазен план");
      PEND = {
        title: BOOK.title, author: BOOK.author, pages: 0, history: true,
        plan: BOOK.plan, scan: BOOK.scan || {}, vars: BOOK.vars || null, spent: BOOK.cost
      };
      goto("advice");
      break;
    }
    case "paste": {
      const v = $("#paste").value.trim();
      if (v.length < 1000) return toast("Нужни са поне 1000 знака");
      prepare({ raw: v, name: "Залепен текст" });
      break;
    }
    case "savecfg": {
      const k = $("#key"); if (k) CFG.key = k.value.trim();
      const rm = $("#readModel"); if (rm) CFG.readModel = rm.value;
      const tm = $("#thinkModel"); if (tm) CFG.thinkModel = tm.value;
      const dp = $("#depth"); if (dp) CFG.depth = dp.value;
      const cm = $("#chatModel"); if (cm) CFG.chatModel = cm.value;
      toast("Запазено");
      break;
    }
    case "testcfg": {
      const n = $("#cfgnote");
      n.textContent = "Проверявам…";
      const k = $("#key"); if (k) CFG.key = k.value.trim();
      try {
        await call("claude-haiku-4-5-20251001", "Отговори само с думата ОК.", { max: 16, cont: 0 });
        n.textContent = "Връзката работи.";
      } catch (err) { n.textContent = "Не става: " + err.message; }
      break;
    }
    case "import": $("#impfile").click(); break;
    case "importtext":
      $("#modalBox").innerHTML = '<h3>Внеси от текст</h3>' +
        '<p>Залепи тук копието, което си запазил — резервно копие в JSON или свален анализ.</p>' +
        '<textarea class="f" id="dumpBox" placeholder="Залепи тук…" style="min-height:180px;font-size:12px"></textarea>' +
        '<button class="btn danger" data-act="doimporttext">Внеси</button>' +
        '<button class="btn" data-act="delno">Откажи</button>';
      $("#modal").classList.add("show");
      break;
    case "doimporttext": {
      const ta = $("#dumpBox");
      const v = ta ? ta.value : "";
      closeModal();
      try {
        const n = await importText(v);
        if (n) { toast("Внесени: " + n); paintLibrary(); }
        else toast("Текстът не съдържа разпознат анализ");
      } catch (err) { toast("Не се прочете: " + err.message); }
      break;
    }
    case "findold": {
      const note = $("#impnote");
      if (note) note.textContent = "Търся…";
      const n = await importOld();
      if (note) note.textContent = n
        ? ""
        : "Не намерих стари книги. Те живеят в паметта на адреса, от който си отварял стария файл — ако този е отворен от друго място, изнеси анализа оттам с „Свали“ и го внеси тук.";
      if (n) { toast("Пренесени: " + n); paintLibrary(); }
      break;
    }
    case "backup": exportAll(); markBackup(); toast("Копието е свалено"); paintLibrary(); break;
    case "backuphow":
      $("#modalBox").innerHTML = `
        <h3>Къде отива копието</h3>
        <p>„Изнеси всичко“ сваля файл <b>dulbok-prochit-backup.json</b> с всички книги, бележки и любими раздели.</p>
        <p><b>Ако видиш „The page is trying to access resources outside the application“</b> — четецът блокира свалянето. В Documents се маха така: приложението Documents → Settings (зъбчатката) → изключи <b>Block external links in HTML viewer</b>. После пробвай пак.</p>
        <p>Не искаш ли да пипаш настройки, натисни <b>„Като текст за копиране“</b> — копираш съдържанието и го залепваш в бележка или файл. Върши същата работа.</p>
        <p><b>В Safari:</b> сваленото е във „Файлове“ → „На моя iPhone“ → „Downloads“. Премести го в iCloud Drive или Google Drive, за да оцелее при смяна на телефон.</p>
        <p>Връщането става от началния екран: <b>„Внеси от файл“</b> или <b>„Внеси от текст“</b>, ако си копирал съдържанието. Двете дават еднакъв резултат.</p>
        <button class="btn" data-act="delno">Разбрах</button>`;
      $("#modal").classList.add("show");
      break;
    case "startjob": startJob(false); break;
    case "resume": resumeJob(); break;
    case "dropjob": JOBDATA = null; await DB.del(JOB); paintLibrary(); break;
    case "readjob": BOOK = JOBDATA.book; goto("reader"); break;
    case "stopjob": CANCEL = true; JOBDATA.running = false; toast("Спирам…"); paintRun(); break;
    case "favfilter": UI.onlyFav = !UI.onlyFav; paintReader(); break;
    case "export": exportMd(); break;
    case "exporttext": exportMd(true); break;
    case "backuptext": exportAll(true); markBackup(); break;
    case "copydump": copyDump(); break;
    case "print": window.print(); break;
    case "fplus": setFont(1); break;
    case "fminus": setFont(-1); break;
  }
});

async function addNote(sid, text, quote) {
  BOOK.ann.notes[sid] = (BOOK.ann.notes[sid] || []).concat([{ id: uid(), text, quote, ts: Date.now() }]);
  UI.open[sid] = true;
  await persistBook(BOOK);
  paintReader();
  toast("Бележката е запазена");
}

function setFont(d) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 16;
  document.documentElement.style.setProperty("--fs", Math.min(22, Math.max(14, cur + d)) + "px");
}

function buildMd(b) {
  let out = "# " + b.title + "\n\n" + (b.author || "") + "\n\n---\n\n";
  b.sections.forEach(s => {
    out += "## " + (b.ann.fav[s.id] ? "★ " : "") + s.title + "\n\n" + s.body + "\n\n";
    const ns = (b.ann.notes || {})[s.id] || [];
    if (ns.length) {
      out += "**Мои бележки:**\n\n";
      ns.forEach(n => { if (n.quote) out += "> " + n.quote + "\n\n"; if (n.text) out += "- " + n.text + "\n"; });
      out += "\n";
    }
    out += "---\n\n";
  });
  return out;
}

function exportMd(asText) {
  const b = BOOK;
  if (!b) return;
  const out = buildMd(b);
  if (asText) return showText(b.title, out, "Маркирай и копирай текста, ако свалянето е блокирано.");
  download((b.title || "analiz").replace(/[^\wа-яА-Я\s-]/gi, "").slice(0, 60) + ".md", out, "text/markdown;charset=utf-8");
}

async function doDelete() {
  const id = PENDING_DEL;
  if (!id) return;
  closeModal();
  await DB.del(bkey(id));
  await DB.del("full:" + id);
  INDEX = INDEX.filter(x => x.id !== id);
  await DB.set(IDX, INDEX);
  if (BOOK && BOOK.id === id) BOOK = null;
  if (CHAT.book && CHAT.book.id === id) { CHAT.book = null; CHAT.openTurn = null; }
  toast("Изтрито");
  paintLibrary();
}

async function saveCopyOf(id) {
  const b = await DB.get(bkey(id));
  if (!b) return toast("Книгата не се намери");
  b.ann = b.ann || { fav: {}, notes: {}, read: {} };
  const md = buildMd(b);
  const ok = download((b.title || "analiz").replace(/[^\wа-яА-Я\s-]/gi, "").slice(0, 60) + ".md",
    md, "text/markdown;charset=utf-8");
  if (ok) toast("Копието е свалено — книгата остава");
  setTimeout(() => showText(b.title, md,
    "Ако свалянето е блокирано от четеца, копирай текста оттук. Книгата остава непокътната."), 400);
}
